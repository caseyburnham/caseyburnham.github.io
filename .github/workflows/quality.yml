name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Use the project Node version
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 26.5.0

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the site
        run: npm run build:deploy

      - name: Validate and lint
        run: npm run validate && npm run lint && node scripts/check-build.mjs

      - name: Run browser smoke tests
        run: npm run smoke
